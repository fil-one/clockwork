name: CI

# A change confined to documentation starts no run, so a docs-only push to main
# deploys nothing. Later patterns override earlier ones. The docs that code or
# tests read stay in: runbooks under docs/operations, the generated access
# matrix, the MNDA template, the two files the trust register cites, and the
# platform spec.
on:
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "docs/operations/**"
      - "docs/security/**"
      - "docs/legal/**"
      - "docs/external-gates.md"
      - "docs/sprint-checklist.md"
      - "!*.md"
      - "commerce_platform_spec.md"
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "docs/operations/**"
      - "docs/security/**"
      - "docs/legal/**"
      - "docs/external-gates.md"
      - "docs/sprint-checklist.md"
      - "!*.md"
      - "commerce_platform_spec.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a pull request run. Runs on main always finish, so
  # every merge reaches the Deploy workflow.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  AUTHORIZATION_CONTEXT_SECRET: clockwork-local-auth-context-secret-change-me
  AUTHORIZATION_CONTEXT_SECRET_ID: local
  CLOCKWORK_RELEASE_SHARED_WORKSPACE: "1"
  CLOCKWORK_RELEASE_BUDGET_MS: "1800000"
  # Type-aware linting holds the whole workspace program in memory: the lint
  # shard peaks at 3.7 GiB against Node's default ~4 GiB old-space ceiling, so a
  # runner with less headroom than a developer machine aborts with SIGABRT
  # (exit 134) rather than a lint failure. Raise the ceiling; ubuntu-24.04 has
  # 16 GB.
  NODE_OPTIONS: "--max-old-space-size=6144"
  NEXT_TELEMETRY_DISABLED: "1"
  STORYBOOK_DISABLE_TELEMETRY: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  release-shards:
    name: Release / ${{ matrix.shard }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - shard: static
            port: 32000
            runner: ubuntu-24.04
          - shard: lint
            port: 32007
            runner: ubuntu-24.04
          - shard: unit
            port: 32001
            runner: ubuntu-24.04
          - shard: integration
            port: 32002
            runner: ubuntu-24.04
          - shard: build
            port: 32003
            runner: ubuntu-24.04
          # The browser suite in two halves, each with its own runner and dev
          # server (`RELEASE_UI_SPEC_FILES` in release-artifacts.mjs).
          - shard: ui-1
            port: 32004
            runner: ubuntu-24.04
          - shard: ui-2
            port: 32008
            runner: ubuntu-24.04
          # `release-suites.mjs` mints the demo access password per run, so
          # nothing here needs a secret.
          - shard: demo
            port: 32006
            runner: ubuntu-24.04
          - shard: proof
            port: 32005
            runner: ubuntu-24.04
    env:
      CLOCKWORK_RELEASE_RUN_ID:
        ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
      CLOCKWORK_RELEASE_ARTIFACT_ROOT: .artifacts/release-ci
      CLOCKWORK_RELEASE_PORT_BASE: ${{ matrix.port }}
      CLOCKWORK_RELEASE_CACHE_ROOT: .artifacts/release-cache/${{ matrix.shard }}
      CLOCKWORK_RELEASE_SHARD: ${{ matrix.shard }}
      PLAYWRIGHT_BROWSERS_PATH:
        .artifacts/release-cache/${{ matrix.shard }}/playwright-browsers
      LOCAL_DB_HOST: 127.0.0.1
      LOCAL_DB_PASSWORD: postgres
      # `supabase start` pulls nine service images, and the CLI's default
      # registry is public.ecr.aws, whose anonymous pull rate is shared by
      # every runner behind the same egress address — it answers
      # "toomanyrequests: Rate exceeded" and the database shards never start.
      # The CLI mirrors the identical tags on ghcr.io, which needs no registry
      # credential and so no repository secret.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - name: Start release budget clock
        run: echo "CLOCKWORK_RELEASE_STARTED_AT=$(date +%s000)" >> "$GITHUB_ENV"
      # Depth 2 keeps a pull request merge commit's base parent, which the
      # integration shard diffs against below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
      - name: Verify exact release toolchain
        run: |
          test "$(node --version)" = "v24.18.1"
          test "$(pnpm --version)" = "10.34.5"
      - name: Isolate package-manager configuration
        run: |
          mkdir -p "$CLOCKWORK_RELEASE_CACHE_ROOT"
          install -m 600 /dev/null "$CLOCKWORK_RELEASE_CACHE_ROOT/empty-user.npmrc"
          install -m 600 /dev/null "$CLOCKWORK_RELEASE_CACHE_ROOT/empty-global.npmrc"
          {
            echo "NPM_CONFIG_USERCONFIG=$CLOCKWORK_RELEASE_CACHE_ROOT/empty-user.npmrc"
            echo "NPM_CONFIG_GLOBALCONFIG=$CLOCKWORK_RELEASE_CACHE_ROOT/empty-global.npmrc"
            echo "XDG_CONFIG_HOME=$CLOCKWORK_RELEASE_CACHE_ROOT/xdg-config"
            echo "GIT_CONFIG_GLOBAL=/dev/null"
            echo "GIT_CONFIG_NOSYSTEM=1"
          } >> "$GITHUB_ENV"
      - name: Frozen install in a fresh isolated store
        run: |
          pnpm install --frozen-lockfile --store-dir "$CLOCKWORK_RELEASE_CACHE_ROOT/pnpm-store"
          echo "CLOCKWORK_RELEASE_FROZEN_INSTALL_VERIFIED=1" >> "$GITHUB_ENV"
      - name: Install Chromium and Linux dependencies
        if:
          startsWith(matrix.shard, 'ui-') || matrix.shard == 'demo' ||
          matrix.shard == 'proof'
        run: pnpm playwright:install:ci
      # `semantic-pdf.integration.test.ts` spawns `pdftotext` directly to read
      # back all 15 rendered document kinds, so Poppler is a hard dependency of
      # this shard rather than a convenience. The runner image does not carry
      # it. Assert the binary answers here, where the failure names itself,
      # instead of letting the test die on a bare spawn ENOENT.
      - name: Install Poppler for semantic PDF extraction
        if: matrix.shard == 'integration'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v
      - name: Select explicit UI fixture adapter
        if: startsWith(matrix.shard, 'ui-')
        run: |
          {
            echo "CLOCKWORK_EXPERIENCE_ADAPTER=demo"
            echo "NEXT_PUBLIC_CLOCKWORK_RUNTIME_ENV=test"
          } >> "$GITHUB_ENV"
      # The populated upgrade replay exercises supabase/, its own fixtures and
      # assertions, and the Drizzle models, so a pull request that changes none
      # of them skips it. pgTAP runs regardless. A push to main, or any diff
      # that cannot be computed, runs the replay.
      - name: Decide whether the populated upgrade replay runs
        if: matrix.shard == 'integration'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          replay=true
          if [ "$EVENT_NAME" = "pull_request" ] &&
            git rev-parse --verify --quiet HEAD^2 > /dev/null &&
            git diff --quiet HEAD^1 HEAD -- supabase \
              scripts/qualify-populated-upgrade.mjs packages/db; then
            replay=false
          fi
          echo "CLOCKWORK_UPGRADE_REPLAY=$replay" >> "$GITHUB_ENV"
          echo "Populated upgrade replay: $replay"
      - name: Start freshly migrated and seeded database
        if: matrix.shard == 'integration' || matrix.shard == 'proof'
        run: |
          pnpm db:start
          pnpm db:reset
          {
            echo "DATABASE_URL=postgresql://postgres.pooler-dev:${LOCAL_DB_PASSWORD}@${LOCAL_DB_HOST}:54329/postgres"
            echo "CLOCKWORK_SERVICE_DATABASE_URL=postgresql://postgres.pooler-dev:${LOCAL_DB_PASSWORD}@${LOCAL_DB_HOST}:54329/postgres"
            echo "DIRECT_DATABASE_URL=postgresql://postgres:${LOCAL_DB_PASSWORD}@${LOCAL_DB_HOST}:54322/postgres"
          } >> "$GITHUB_ENV"
      - name: Run isolated release shard
        run:
          node scripts/release-suites.mjs --mode=parallel
          --shard="$CLOCKWORK_RELEASE_SHARD"
      - name: Stop database
        if:
          always() && (matrix.shard == 'integration' || matrix.shard == 'proof')
        run: pnpm exec supabase stop --no-backup
      - name: Upload readable shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.shard }}
          path: |
            .artifacts/release-ci/
            !.artifacts/release-ci/**/auth/**
          if-no-files-found: error
          retention-days: 14

  # The launch ledger checks run on pushes to main only, so the ledger cannot
  # drift unnoticed. This job is not a release shard and the gate does not
  # depend on it.
  launch-ledger:
    name: Launch ledger
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:launch

  release-gate:
    name: Parallel release gate
    if: always()
    needs: [release-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: .artifacts/release-join
      - name: Validate repository governance policy
        run: node --test scripts/release-artifacts.test.mjs
      - name: Require every shard, isolation contract, and 30-minute budget
        env:
          RELEASE_SHARDS_RESULT: ${{ needs.release-shards.result }}
        run: |
          test "$RELEASE_SHARDS_RESULT" = "success"
          node scripts/validate-release-join.mjs .artifacts/release-join
