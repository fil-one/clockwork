name: CI

on:
  pull_request:
  push:
    branches: [main, "commerce/**", "rc/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  AUTHORIZATION_CONTEXT_SECRET: clockwork-local-auth-context-secret-change-me
  AUTHORIZATION_CONTEXT_SECRET_ID: local
  CLOCKWORK_RELEASE_SHARED_WORKSPACE: "1"
  CLOCKWORK_RELEASE_BUDGET_MS: "1800000"

jobs:
  release-shards:
    name: Release / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - shard: static
            port: 32000
          - shard: unit
            port: 32001
          - shard: integration
            port: 32002
          - shard: build
            port: 32003
          - shard: ui
            port: 32004
          - shard: proof
            port: 32005
    env:
      CLOCKWORK_RELEASE_RUN_ID:
        ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
      CLOCKWORK_RELEASE_ARTIFACT_ROOT: .artifacts/release-ci
      CLOCKWORK_RELEASE_PORT_BASE: ${{ matrix.port }}
      LOCAL_DB_HOST: 127.0.0.1
      LOCAL_DB_PASSWORD: postgres
    steps:
      - name: Start release budget clock
        run: echo "CLOCKWORK_RELEASE_STARTED_AT=$(date +%s000)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        if: matrix.shard == 'ui' || matrix.shard == 'proof'
        run: pnpm playwright:install:ci
      - name: Select explicit UI fixture adapter
        if: matrix.shard == 'ui'
        run: |
          echo "CLOCKWORK_EXPERIENCE_ADAPTER=demo" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_CLOCKWORK_RUNTIME_ENV=test" >> "$GITHUB_ENV"
      - name: Start freshly migrated and seeded database
        if: matrix.shard == 'integration' || matrix.shard == 'proof'
        run: |
          pnpm exec supabase stop --no-backup || true
          pnpm db:start
          pnpm db:reset
          echo "DATABASE_URL=postgresql://postgres.pooler-dev:${LOCAL_DB_PASSWORD}@${LOCAL_DB_HOST}:54329/postgres" >> "$GITHUB_ENV"
          echo "CLOCKWORK_SERVICE_DATABASE_URL=postgresql://postgres.pooler-dev:${LOCAL_DB_PASSWORD}@${LOCAL_DB_HOST}:54329/postgres" >> "$GITHUB_ENV"
          echo "DIRECT_DATABASE_URL=postgresql://postgres:${LOCAL_DB_PASSWORD}@${LOCAL_DB_HOST}:54322/postgres" >> "$GITHUB_ENV"
      - name: Run isolated release shard
        run:
          node scripts/release-suites.mjs --mode=parallel --shard=${{
          matrix.shard }}
      - name: Stop database
        if:
          always() && (matrix.shard == 'integration' || matrix.shard == 'proof')
        run: pnpm exec supabase stop --no-backup || true
      - name: Upload readable shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.shard }}
          path: |
            .artifacts/release-ci/
            !.artifacts/release-ci/**/auth/**
          if-no-files-found: error
          retention-days: 14

  release-gate:
    name: Parallel release gate
    if: always()
    needs: [release-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: .artifacts/release-join
      - name: Require every shard, isolation contract, and 30-minute budget
        run: node scripts/validate-release-join.mjs .artifacts/release-join
