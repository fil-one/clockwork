# Build mechanics only. Demo behaviour is env-gated and set on the site, never
# committed, so a build from this file alone produces the ordinary application.
# package.json declares packageManager pnpm@10.34.5, so the platform provisions
# pnpm and installs from the lockfile before this command runs.
[build]
  command = "node scripts/check-demo-deploy-environment.mjs && pnpm exec turbo run build --filter=@clockwork/web"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "24.18.1"
  TURBO_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
